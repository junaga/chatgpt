[package]
name = "chatgpt-linux-desktop-bridge"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
publish = false
description = "Shared protocol and platform-neutral core for ChatGPT Linux desktop control"

[[bin]]
name = "chatgpt-linux-desktop-bridge"
path = "src/bin/chatgpt-linux-desktop-bridge.rs"
required-features = ["native-probes"]

[[bin]]
name = "chatgpt-linux-computer-use"
path = "src/bin/chatgpt-linux-computer-use.rs"
required-features = ["native-atspi", "native-probes"]

[features]
default = ["native-atspi", "native-probes"]
native-atspi = ["dep:atspi"]
native-probes = ["dep:ashpd", "dep:x11rb"]

[dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["global_shortcuts", "remote_desktop", "screencast", "screenshot", "tokio"], optional = true }
atspi = { version = "0.30.0", default-features = false, features = ["connection", "proxies", "tokio"], optional = true }
futures-util = "0.3.33"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.16"
tokio = { version = "1.53.1", features = ["rt", "time"] }
x11rb = { version = "0.14.0", optional = true }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
